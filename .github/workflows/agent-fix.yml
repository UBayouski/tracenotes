# Companion to agent-ticket.yml: a human comments `@claude ...` on a PR or issue (for example
# "@claude address the Qodo findings on this PR") and the agent pushes fixes to that PR's branch.
# Qodo re-reviews the new commit. The human decides whether the review is clean enough to merge.
name: Agent fixes review findings

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  fix:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm run check),Bash(npm test),Bash(npm run typecheck),Bash(node src/cli.ts:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
